name: build-frida-ios-stealth

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Frida version tag to build (blank = latest stable release)"
        required: false
        default: ""
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "tools/**"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcodes:"; ls /Applications | grep -i xcode || true
          for x in Xcode_15.4 Xcode_15.3 Xcode_15.2 Xcode_15.1 Xcode_15.0.1 Xcode; do
            if [ -d "/Applications/$x.app" ]; then sudo xcode-select -s "/Applications/$x.app"; break; fi
          done
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Install build deps
        run: |
          brew install make dpkg ldid coreutils || true
          echo "node: $(node --version 2>/dev/null)"
          echo "npm:  $(npm --version 2>/dev/null)"
          echo "py:   $(python3 --version 2>/dev/null)"
          echo "gmake: $(gmake --version 2>/dev/null | head -1)"

      - name: Build frida-server (iOS rootless arm64e)
        id: build
        run: |
          set -o pipefail
          bash scripts/build-ios.sh "${{ github.event.inputs.frida_version }}" 2>&1 | tee build.log

      - name: Read frida version
        if: always()
        id: meta
        run: |
          if [ -f out/FRIDA_VERSION.txt ]; then
            echo "ver=$(cat out/FRIDA_VERSION.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frida-ios-stealth
          path: |
            out/*.deb
            build.log
            patch-report.txt
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.meta.outputs.ver }}"
          [ -z "$ver" ] && ver="unknown"
          tag="v${ver}"
          notes="release-notes.md"
          {
            echo "Anti-detect frida-server for iOS - roothide Dopamine, rootless, arm64e."
            echo
            echo "- frida version: \`${ver}\`"
            echo "- built: $(date -u +%FT%TZ) in GitHub Actions (macos-14)"
            echo
            echo "## Applied / skipped Florida patches"
            echo '```'
            cat patch-report.txt 2>/dev/null || echo "no patch report"
            echo '```'
          } > "$notes"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.deb --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" out/*.deb \
              --title "frida-server stealth ${ver} (rootless arm64e)" \
              --notes-file "$notes" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Report status to ci-status branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/report-status.sh "${{ job.status }}"
